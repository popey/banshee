name: Build and review snap
on:
  push:
    branches: [revival/2.6.2]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [revival/2.6.2]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build with LXD
        id: build
        uses: canonical/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          snapcraft-args: --use-lxd
      - name: Run regression checks in the builder
        run: sudo -E bash tools/validate-lxd.sh
      - name: Review exact artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          sudo -E bash tools/review-snap.sh banshee_2.6.2_amd64.snap
      - name: Save snap and validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: banshee-2.6.2-amd64
          if-no-files-found: warn
          path: |
            banshee_2.6.2_amd64.snap
            /tmp/banshee-regression.log
            /tmp/banshee-snap-review.log
            /tmp/banshee-snap.sha256
            /tmp/banshee-store-declaration.assert
            /tmp/banshee-review-slots.json
